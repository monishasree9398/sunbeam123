<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wanna know?</title>
</head>

    <title>My Perfect Day</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background-image:url("https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRPbLAls7nRC_zidCV3ZaFkm1x1qut61fqYUw4MoQIpvPE15ZqwUb8dtUs&s=10");
            background-size: cover;
            background-position: center;
            background-repeat: repeat;
        }

        .container {
            text-align: center;
        }

        h1 {
            font-size: 45px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 25px;
        }

        button {
            padding: 18px 35px;
            border: none;
            border-radius: 30px;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.5s ease;
        }

        .perfect {
            background: pink;
        }

        .bad {
            background: white;
        }

        /* Hover over Bad Day */
        .buttons:has(.bad:hover) .bad {
            transform: scale(0);
            opacity: 0;
        }

        .buttons:has(.bad:hover) .perfect {
            transform: scale(1.4);
        }
    </style>


<body>

    <div class="container">

        <h1 style="color: rgb(60, 210, 175); font-family: 'Trebuchet MS';font-size:70px;">Want to know about my day? </h1>
        <p>Choose wisely...</p>

        <div class="buttons">
            <a href="file:///Users/monishasree/Desktop/html-css/website.html" target="_blank"><button class="perfect" style="margin-right: 17px;"> Perfect Day</button></a>
            <button class="bad" style="margin-left: 17px;">Bad Day</button>
        </div>

    </div>

</body>

</html>
